<title>客户跟进记录本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: ledger — left column lists customer types with due-status, right column is that type's dated message log */
:root{
  --bg:#f6f7f5; --panel:#ffffff; --ink:#1b2422; --muted:#5f6b67; --line:#dde3e0;
  --accent:#0f6b5c; --accent-soft:#e2f0ec; --gold:#a8741a;
  --late:#b3261e; --late-soft:#fbe7e5; --due:#9a5b00; --due-soft:#fdf0d9; --ok:#1d6b3a; --ok-soft:#e3f2e8;
  --f-display:"Noto Serif SC","Songti SC",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121816; --panel:#1a2220; --ink:#e6ece9; --muted:#9aa8a3; --line:#2c3633;
  --accent:#5cc2ad; --accent-soft:#1d3530; --gold:#e0b25a;
  --late:#ff8a80; --late-soft:#3a1f1d; --due:#f2b54f; --due-soft:#3a2d16; --ok:#7fd49b; --ok-soft:#1b3324; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --panel:#1a2220; --ink:#e6ece9; --muted:#9aa8a3; --line:#2c3633;
  --accent:#5cc2ad; --accent-soft:#1d3530; --gold:#e0b25a;
  --late:#ff8a80; --late-soft:#3a1f1d; --due:#f2b54f; --due-soft:#3a2d16; --ok:#7fd49b; --ok-soft:#1b3324; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:16px;border-bottom:2px solid var(--ink);margin-bottom:20px}
h1{font-family:var(--f-display);font-size:28px;margin:0;line-height:1.2;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.search{flex:1 1 260px;max-width:380px;position:relative}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{min-height:120px;resize:vertical;line-height:1.6}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);padding:7px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:500}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
button.ghost:hover{color:var(--ink);background:var(--accent-soft)}
button.danger{color:var(--late);border-color:var(--late)}
.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.side{display:flex;flex-direction:column;gap:10px}
.side-head{display:flex;justify-content:space-between;align-items:center}
.seg{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:0 12px;align-items:center;text-align:left;width:100%;padding:12px 12px 12px 0;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg .bar{align-self:stretch;margin:-12px 0;background:var(--line)}
.seg.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.seg.active .bar{background:var(--accent)}
.seg .name{font-weight:700;min-width:0;overflow-wrap:anywhere}
.seg .meta{font-size:12px;color:var(--muted);grid-column:2}
.seg .pill{grid-row:1/span 2;grid-column:3}
.text.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{color:var(--accent);font-weight:500}
@media (min-width:821px){aside.side{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}}
@media (max-width:820px){#segList{flex-direction:row;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}#segList .seg{flex:0 0 78%;scroll-snap-align:start}}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.due{background:var(--due-soft);color:var(--due)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.none{background:var(--accent-soft);color:var(--muted)}
.pill.plan{background:transparent;color:var(--gold);border:1px dashed var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:560px){.form{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.mhead h2{font-family:var(--f-display);font-size:22px;margin:0;line-height:1.3}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:8px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin:6px 0 0;white-space:pre-wrap}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.date{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;line-height:1.3}
.date small{display:block;font-family:var(--f-body);color:var(--muted);font-size:12px;margin-top:2px}
.entry.planned .date{color:var(--gold)}
.body{min-width:0}
.body .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted)}
.chip{border:1px solid var(--line);border-radius:4px;padding:0 6px}
.text{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.text mark{background:var(--due-soft);color:inherit;padding:0 1px}
.tools{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px}
@media (max-width:560px){.entry{grid-template-columns:minmax(0,1fr);gap:4px}.date small{display:inline;margin-left:6px}}
.empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:14px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--late-soft);color:var(--late);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:13px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumb{position:relative;width:96px;height:96px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--accent-soft);padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:2px;right:2px;width:24px;height:24px;padding:0;border-radius:50%;background:var(--ink);color:var(--bg);border:0;font-size:14px;line-height:24px}
.drop{border:1px dashed var(--line);border-radius:8px;padding:12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.lightbox{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:20}
.banner{background:var(--due-soft);color:var(--due);border-radius:8px;padding:10px 14px;font-size:14px}
.seg-of{font-weight:500;color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.seg,button{transition:background .15s,border-color .15s}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>客户跟进记录本</h1>
      <p class="sub">按客户类型记下每次发了什么、哪天发的。系统会按「几天发一次」提醒下一封的日期。</p>
    </div>
    <div class="search">
      <label class="label" for="q">搜索以前发过的内容</label>
      <input id="q" type="search" placeholder="输入关键词，例如：股权、优惠、开课日期">
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <div class="grid">
    <aside class="side">
      <div class="side-head">
        <span class="label">客户类型</span>
        <button class="ghost" id="addSegBtn" type="button">＋ 新增类型</button>
      </div>
      <div id="segForm" class="card" hidden></div>
      <div id="segList" class="side">
        <div class="empty">正在载入客户类型…</div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="card empty">左边选一个客户类型，就能看到给这类客户发过的所有信息。<br>还没有类型的话，点「＋ 新增类型」先建一个。</div>
    </main>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<div id="lb" class="lightbox" hidden><img id="lbImg" alt="放大的图片"></div>

<script>
const S = { db:null, user:null, me:null, segs:[], msgs:[], sel:null, editing:null, editingSeg:null, confirmDel:null, formOpen:false, assets:null, pending:[], keep:[], expanded:{}, q:"", names:{}, canWrite:true };
try { S.sel = localStorage.getItem("crm.sel"); } catch(e) {}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const todayStr = () => { const d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const toDay = s => { const [y,m,d] = s.split("-").map(Number); return Date.UTC(y,m-1,d)/864e5; };
const fromDay = n => { const d = new Date(n*864e5); return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate()); };
const WEEK = ["日","一","二","三","四","五","六"];
const weekday = s => "星期" + WEEK[new Date(toDay(s)*864e5).getUTCDay()];
const CHANNELS = ["WhatsApp","WeChat","Email","电话","Facebook / IG","其他"];

function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2200); }
function fail(e){ console.error(e); toast(e && e.code==="quota_exceeded" ? "存储已满，请删除一些旧记录后再试" : e && e.code==="invalid_argument" ? "你目前只有查看权限，不能修改" : "没保存成功，请检查网络后再试一次"); }

function segStatus(seg){
  const sent = S.msgs.filter(m=>m.segmentId===seg.id && m.status!=="planned").map(m=>m.date).sort();
  const planned = S.msgs.filter(m=>m.segmentId===seg.id && m.status==="planned").map(m=>m.date).sort();
  const last = sent[sent.length-1] || null;
  const cad = Number(seg.cadenceDays)||3;
  const today = toDay(todayStr());
  if(!last) return { last:null, next:null, cls:"none", text:"还没发过", planned, count:sent.length };
  const next = toDay(last) + cad, diff = next - today;
  let cls, text;
  if(diff<0){ cls="late"; text="逾期 "+(-diff)+" 天"; }
  else if(diff===0){ cls="due"; text="今天该发"; }
  else if(diff===1){ cls="due"; text="明天该发"; }
  else { cls="ok"; text=diff+" 天后"; }
  return { last, next:fromDay(next), cls, text, planned, count:sent.length };
}

function renderSegs(){
  const box=$("segList");
  if(!S.segs.length){ box.innerHTML='<div class="card empty">还没有客户类型。<br>点上面「＋ 新增类型」建第一个，例如「上过 Preview、还没报 3 天课」。</div>'; return; }
  box.innerHTML = S.segs.map(seg=>{
    const st=segStatus(seg);
    return `<button type="button" class="seg ${seg.id===S.sel?"active":""}" data-seg="${esc(seg.id)}">
      <span class="bar"></span><span class="name">${esc(seg.name)}</span>
      <span class="pill ${st.cls}">${st.text}</span>
      <span class="meta">每 ${esc(seg.cadenceDays)} 天一封 · 已发 ${st.count} 封${st.last?" · 上次 "+st.last.slice(5):""}</span>
    </button>`;
  }).join("");
}

function segFormHTML(seg){
  return `<form id="sf" class="side" style="gap:10px">
    <div class="field"><label class="label" for="sfName">类型名称</label><input id="sfName" type="text" required maxlength="60" value="${esc(seg?.name)}" placeholder="例如：上过 Preview，还没报 3 天课"></div>
    <div class="field"><label class="label" for="sfCad">几天发一封</label><input id="sfCad" type="number" min="1" max="60" required value="${esc(seg?.cadenceDays ?? 3)}"></div>
    <div class="field"><label class="label" for="sfNote">备注（跟进目的、注意事项）</label><textarea id="sfNote" style="min-height:70px" maxlength="500">${esc(seg?.note)}</textarea></div>
    <div class="actions"><button type="button" id="sfCancel">取消</button><button class="primary" type="submit">${seg?"保存":"建立"}</button></div>
  </form>`;
}
function openSegForm(seg){
  S.editingSeg = seg || null;
  const f=$("segForm"); f.innerHTML=segFormHTML(seg); f.hidden=false; $("sfName").focus();
  $("sfCancel").onclick=()=>{ f.hidden=true; S.editingSeg=null; };
  $("sf").onsubmit=async ev=>{
    ev.preventDefault();
    const data={ name:$("sfName").value.trim(), cadenceDays:Math.max(1,Number($("sfCad").value)||3), note:$("sfNote").value.trim() };
    if(!data.name) return;
    try{
      if(S.editingSeg){ await S.db.doc("segments/"+S.editingSeg.id).update(data); toast("已保存"); }
      else { data.createdAt=new Date().toISOString(); data.order=Date.now(); const ref=await S.db.collection("segments").add(data); select(ref.id); toast("已建立"); }
      f.hidden=true; S.editingSeg=null;
    }catch(e){ fail(e); }
  };
}

function entryHTML(m, showSeg){
  const who = m.by ? (S.names[m.by] || "同事") : "";
  const planned = m.status==="planned";
  let text = esc(m.content);
  if(S.q){ const re=new RegExp(S.q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"); text=text.replace(re, x=>"<mark>"+x+"</mark>"); }
  const seg = showSeg ? S.segs.find(s=>s.id===m.segmentId) : null;
  return `<li class="entry ${planned?"planned":""}">
    <div class="date">${esc(m.date)}<small>${weekday(m.date)}</small></div>
    <div class="body">
      <div class="chips">${seg?`<span class="seg-of">${esc(seg.name)}</span>`:""}${planned?'<span class="pill plan">计划要发</span>':""}${m.channel?`<span class="chip">${esc(m.channel)}</span>`:""}${who?`<span>记录人：${esc(who)}</span>`:""}</div>
      ${(()=>{ const long=(m.content||"").length>160 || (m.content||"").split("\n").length>4; const open=S.expanded[m.id];
        return `<p class="text ${long&&!open?"clamp":""}">${text}</p>${long?`<button class="ghost more" type="button" data-more="${esc(m.id)}">${open?"收起":"展开全文"}</button>`:""}`; })()}
      ${(m.images||[]).length?`<div class="thumbs">${m.images.map(id=>`<button type="button" class="thumb" data-zoom="${esc(id)}" aria-label="放大图片"><img loading="lazy" src="/_blob/${esc(id)}" alt="附图"></button>`).join("")}</div>`:""}
      <div class="tools">
        <button class="ghost" type="button" data-copy="${esc(m.id)}">复制内容</button>
        ${planned?`<button class="ghost" type="button" data-mark="${esc(m.id)}">标记为已发送</button>`:""}
        <button class="ghost" type="button" data-edit="${esc(m.id)}">修改</button>
        <button class="ghost" type="button" data-del="${esc(m.id)}">删除</button>
      </div>
      ${S.confirmDel===m.id?`<div class="confirm">确定删除这条记录？删除后找不回来。<button type="button" class="danger" data-delyes="${esc(m.id)}">删除</button><button type="button" data-delno="1">取消</button></div>`:""}
    </div>
  </li>`;
}

function renderMain(){
  const main=$("main");
  if(S.q){
    const q=S.q.toLowerCase();
    const hits=S.msgs.filter(m=>(m.content||"").toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));
    main.innerHTML=`<div class="card"><div class="mhead"><div><h2>搜索「${esc(S.q)}」</h2><div class="stats">在所有客户类型里找到 <b>${hits.length}</b> 条</div></div><button type="button" id="clearQ">清除搜索</button></div></div>
      <div class="card">${hits.length?`<ul class="log">${hits.map(m=>entryHTML(m,true)).join("")}</ul>`:'<div class="empty">没有发过包含这个词的信息。</div>'}</div>`;
    $("clearQ").onclick=()=>{ $("q").value=""; S.q=""; renderMain(); };
    return;
  }
  const seg=S.segs.find(s=>s.id===S.sel);
  if(!seg){ main.innerHTML=`<div class="card empty">左边选一个客户类型，就能看到给这类客户发过的所有信息。<br>还没有类型的话，点「＋ 新增类型」先建一个。</div>`; return; }
  const st=segStatus(seg);
  const list=S.msgs.filter(m=>m.segmentId===seg.id).sort((a,b)=>b.date.localeCompare(a.date) || (b.createdAt||"").localeCompare(a.createdAt||""));
  const ed = S.editing ? S.msgs.find(m=>m.id===S.editing) : null;
  const defDate = ed ? ed.date : todayStr();
  main.innerHTML=`
  <div class="card">
    <div class="mhead">
      <div style="min-width:0">
        <h2>${esc(seg.name)}</h2>
        <div class="stats">
          <span>每 <b>${esc(seg.cadenceDays)}</b> 天一封</span>
          <span>上次发：<b>${st.last||"—"}</b></span>
          <span>下次该发：<b>${st.next||"随时"}</b> <span class="pill ${st.cls}">${st.text}</span></span>
          <span>已发：<b>${st.count}</b> 封</span>
        </div>
        ${seg.note?`<p class="note">${esc(seg.note)}</p>`:""}
      </div>
      <div class="actions"><button class="primary" type="button" id="newMsg" ${S.formOpen?"hidden":""}>＋ 记一条新信息</button><button class="ghost" type="button" id="editSeg">修改类型</button><button class="ghost" type="button" id="delSeg">删除类型</button></div>
    </div>
    ${S.confirmDel==="seg:"+seg.id?`<div class="confirm">${list.length?`这个类型下还有 ${list.length} 条记录，请先删除或改到其他类型，才能删除这个类型。<button type="button" data-delno="1">知道了</button>`:`确定删除这个类型？<button type="button" class="danger" id="delSegYes">删除</button><button type="button" data-delno="1">取消</button>`}</div>`:""}
  </div>

  <form class="card form" id="mf" ${S.formOpen?"":"hidden"}>
    <div class="full label">${ed?"修改这条记录":"记一条新信息"}</div>
    <div class="field"><label class="label" for="mfDate">日期</label><input id="mfDate" type="date" required value="${esc(defDate)}"></div>
    <div class="field"><label class="label" for="mfCh">发送渠道</label><select id="mfCh">${CHANNELS.map(c=>`<option ${ (ed?ed.channel:"WhatsApp")===c?"selected":""}>${c}</option>`).join("")}</select></div>
    <div class="field"><label class="label" for="mfSt">状态</label><select id="mfSt"><option value="sent" ${ed?.status!=="planned"?"selected":""}>已发送</option><option value="planned" ${ed?.status==="planned"?"selected":""}>计划要发</option></select></div>
    ${ed?`<div class="field full"><label class="label" for="mfSeg">客户类型</label><select id="mfSeg">${S.segs.map(s=>`<option value="${esc(s.id)}" ${s.id===ed.segmentId?"selected":""}>${esc(s.name)}</option>`).join("")}</select></div>`:""}
    <div class="field full"><label class="label" for="mfText">发了什么内容</label><textarea id="mfText" placeholder="把发出去的信息原文贴在这里（也可以直接把截图贴进来）">${esc(ed?.content)}</textarea></div>
    <div class="field full"><span class="label">图片</span>${S.assets?`<div class="drop" id="mfDrop"><button type="button" id="mfPick">＋ 上载图片</button><input id="mfFile" type="file" accept="image/*" multiple hidden><span>可以一次选多张，或把图片拖进来、直接贴上（Ctrl+V）</span><div class="thumbs" id="mfImgs" style="flex-basis:100%;margin-top:0"></div></div>`:`<div class="drop">你目前没有上载图片的权限。请网页拥有人在「Share」里把你设为 Editor 或 Contributor。</div>`}</div>
    <div class="full actions"><button type="button" id="mfCancel">取消</button><button class="primary" type="submit">${ed?"保存修改":"保存这条记录"}</button></div>
  </form>

  <div class="card">
    <div class="label" style="margin-bottom:6px">发送记录 · 共 ${list.length} 条（最新的在上面）</div>
    ${list.length?`<ul class="log">${list.map(m=>entryHTML(m,false)).join("")}</ul>`:'<div class="empty">这个类型还没有记录。点上面的「＋ 记一条新信息」，贴上第一封信息的内容。</div>'}
  </div>`;

  $("editSeg").onclick=()=>openSegForm(seg);
  $("delSeg").onclick=()=>{ S.confirmDel="seg:"+seg.id; renderMain(); };
  const dy=$("delSegYes"); if(dy) dy.onclick=async()=>{ try{ await S.db.doc("segments/"+seg.id).delete(); S.confirmDel=null; select(null); toast("已删除类型"); }catch(e){ fail(e); } };
  $("mfCancel").onclick=()=>{ S.editing=null; S.formOpen=false; clearPending(); S.keep=[]; renderMain(); };
  $("newMsg").onclick=()=>{ S.formOpen=true; S.editing=null; clearPending(); S.keep=[]; renderMain(); $("mfText").focus(); };
  if(S.assets){
    $("mfPick").onclick=()=>$("mfFile").click();
    $("mfFile").onchange=e=>{ addFiles(e.target.files); e.target.value=""; };
    const dz=$("mfDrop");
    dz.ondragover=e=>{ e.preventDefault(); dz.classList.add("over"); };
    dz.ondragleave=()=>dz.classList.remove("over");
    dz.ondrop=e=>{ e.preventDefault(); dz.classList.remove("over"); addFiles(e.dataTransfer.files); };
    renderPending();
  }
  $("mf").onsubmit=async ev=>{
    ev.preventDefault();
    const content=$("mfText").value.trim();
    if(!content && !S.keep.length && !S.pending.length){ toast("请填内容，或放一张图片"); return; }
    const data={ date:$("mfDate").value||todayStr(), channel:$("mfCh").value, status:$("mfSt").value, content };
    const btn=ev.submitter; if(btn){ btn.disabled=true; btn.textContent=S.pending.length?"图片上载中…":"保存中…"; }
    try{
      const ids=[...S.keep];
      for(const p of S.pending){ const blob=await shrink(p.file); const res=await S.assets.upload(blob); ids.push(res.id); }
      data.images=ids;
      if(ed) for(const old of (ed.images||[])) if(!ids.includes(old)) S.assets?.delete(old).catch(()=>{});
      clearPending();
      if(ed){ data.segmentId=$("mfSeg").value; data.updatedAt=new Date().toISOString(); await S.db.doc("messages/"+ed.id).update(data); S.editing=null; S.formOpen=false; toast("已保存修改"); renderSegs(); renderMain(); }
      else { Object.assign(data,{ segmentId:seg.id, by:S.me||"", createdAt:new Date().toISOString() }); await S.db.collection("messages").add(data); S.formOpen=false; toast("已记录"); renderSegs(); renderMain(); }
    }catch(e){ fail(e); if(btn){ btn.disabled=false; btn.textContent=ed?"保存修改":"保存这条记录"; } }
  };
}

function addFiles(list){
  const imgs=[...(list||[])].filter(f=>f.type && f.type.startsWith("image/"));
  if(!imgs.length) return;
  for(const f of imgs){ if(S.keep.length+S.pending.length>=9){ toast("每条最多 9 张图片"); break; } S.pending.push({file:f, url:URL.createObjectURL(f)}); }
  renderPending();
}
function clearPending(){ S.pending.forEach(p=>URL.revokeObjectURL(p.url)); S.pending=[]; }
function renderPending(){
  const box=$("mfImgs"); if(!box) return;
  box.innerHTML = S.keep.map((id,i)=>`<div class="thumb"><img src="/_blob/${esc(id)}" alt="已上载的图片"><button type="button" class="x" data-rmkeep="${i}" aria-label="移除这张">×</button></div>`).join("")
    + S.pending.map((p,i)=>`<div class="thumb"><img src="${p.url}" alt="待上载的图片"><button type="button" class="x" data-rmpend="${i}" aria-label="移除这张">×</button></div>`).join("");
}
// 大图先缩小再上载，省空间也上载得快
async function shrink(file){
  if(file.type==="image/gif" || file.type==="image/svg+xml" || file.size<800*1024) return file;
  try{
    const bmp=await createImageBitmap(file); const max=1800; const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const out=await new Promise(res=>c.toBlob(res,"image/jpeg",0.85));
    return out && out.size<file.size ? out : file;
  }catch(e){ return file; }
}
function openLightbox(id){ $("lbImg").src="/_blob/"+id; $("lb").hidden=false; }
$("lb").onclick=()=>{ $("lb").hidden=true; $("lbImg").removeAttribute("src"); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("lb").hidden) $("lb").click(); });
document.addEventListener("paste",e=>{ if(!S.assets || !$("mf") || $("mf").hidden) return; const fs=[...(e.clipboardData?.files||[])]; if(fs.length){ e.preventDefault(); addFiles(fs); } });

function render(){ renderSegs(); renderMain(); }
function select(id){ S.sel=id; S.editing=null; S.formOpen=false; clearPending(); S.keep=[]; S.confirmDel=null; try{ id?localStorage.setItem("crm.sel",id):localStorage.removeItem("crm.sel"); }catch(e){} if(S.q){ S.q=""; $("q").value=""; } render(); }

document.addEventListener("click", async ev=>{
  const t=ev.target.closest("button"); if(!t) return;
  if(t.dataset.seg){ select(t.dataset.seg); if(window.innerWidth<820) $("main").scrollIntoView({behavior:"smooth"}); return; }
  if(t.dataset.copy){ const m=S.msgs.find(x=>x.id===t.dataset.copy); if(!m) return;
    try{ await navigator.clipboard.writeText(m.content); toast("已复制，可以直接贴到 WhatsApp"); }
    catch(e){ const p=t.closest(".body").querySelector(".text"); const r=document.createRange(); r.selectNodeContents(p); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("已选中文字，请按复制"); } return; }
  if(t.dataset.edit){ const m=S.msgs.find(x=>x.id===t.dataset.edit); if(!m) return; if(S.q){ S.q=""; $("q").value=""; } S.sel=m.segmentId; S.editing=m.id; S.formOpen=true; S.confirmDel=null; clearPending(); S.keep=[...(m.images||[])]; render(); $("mf").scrollIntoView({behavior:"smooth"}); $("mfText").focus({preventScroll:true}); return; }
  if(t.dataset.mark){ try{ await S.db.doc("messages/"+t.dataset.mark).update({status:"sent", date:todayStr()}); toast("已标记为今天发送"); }catch(e){ fail(e); } return; }
  if(t.dataset.zoom){ openLightbox(t.dataset.zoom); return; }
  if(t.dataset.rmkeep){ S.keep.splice(Number(t.dataset.rmkeep),1); renderPending(); return; }
  if(t.dataset.rmpend){ const [p]=S.pending.splice(Number(t.dataset.rmpend),1); if(p) URL.revokeObjectURL(p.url); renderPending(); return; }
  if(t.dataset.more){ S.expanded[t.dataset.more]=!S.expanded[t.dataset.more]; renderMain(); return; }
  if(t.dataset.del){ S.confirmDel=t.dataset.del; renderMain(); return; }
  if(t.dataset.delno){ S.confirmDel=null; renderMain(); return; }
  if(t.dataset.delyes){ const m=S.msgs.find(x=>x.id===t.dataset.delyes); try{ await S.db.doc("messages/"+t.dataset.delyes).delete(); for(const id of (m?.images||[])) S.assets?.delete(id).catch(()=>{}); S.confirmDel=null; toast("已删除"); }catch(e){ fail(e); } return; }
});
$("addSegBtn").onclick=()=>openSegForm(null);
let qt; $("q").addEventListener("input", e=>{ clearTimeout(qt); qt=setTimeout(()=>{ S.q=e.target.value.trim(); S.confirmDel=null; renderMain(); },200); });

async function resolveNames(){
  if(!S.user) return;
  const ids=[...new Set(S.msgs.map(m=>m.by).filter(Boolean))];
  if(!ids.length) return;
  try{ const ps=await S.user.profiles(ids); let changed=false;
    for(const id of ids){ const n=(ps[id]&&ps[id].name)||""; if(n && S.names[id]!==n){ S.names[id]=n; changed=true; } }
    if(changed && !S.editing) renderMain();
  }catch(e){}
}

(async()=>{
  const [db,user,assets]=await Promise.all([window.claude?.use("db") ?? null, window.claude?.use("user") ?? null, window.claude?.use("assets") ?? null]);
  S.assets=assets;
  if(!db){ $("segList").innerHTML=""; const b=$("banner"); b.hidden=false; b.textContent="现在无法连接资料库。请先登入 claude.ai，再重新打开这个网页。"; return; }
  S.db=db; S.user=user;
  try{ S.me = user ? await user.id() : null; }catch(e){}
  db.collection("segments").orderBy("order").onSnapshot(snap=>{
    S.segs=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!S.sel && S.segs.length) S.sel=S.segs[0].id;
    if(S.sel && !S.segs.find(s=>s.id===S.sel)) S.sel=S.segs[0]?.id||null;
    renderSegs(); if(!document.activeElement || !document.activeElement.closest("#mf")) renderMain();
  }, fail);
  db.collection("messages").onSnapshot(snap=>{
    S.msgs=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderSegs(); if(!document.activeElement || !document.activeElement.closest("#mf")) renderMain(); resolveNames();
  }, fail);
})();
</script>
