<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全赢资本 股权教练</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--gold:#b08a3e;--navy:#14284b;--line:#e4e0d6}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
header .logo{width:36px;height:36px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-weight:700}
header h1{font-size:17px;margin:0}
header p{margin:2px 0 0;font-size:12px;opacity:.75}
header button{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:18px;max-width:820px;width:100%;margin:0 auto}
.msg{margin:0 0 14px;display:flex}
.msg .b{padding:12px 14px;border-radius:14px;line-height:1.65;font-size:15px;max-width:88%;white-space:normal;word-wrap:break-word}
.msg.user{justify-content:flex-end}
.msg.user .b{background:var(--navy);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.bot .b{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.b h3,.b h4{margin:10px 0 4px;font-size:15px;color:var(--navy)}
.b ul,.b ol{margin:4px 0;padding-left:20px}
.b p{margin:6px 0}
.b table{border-collapse:collapse;margin:6px 0;font-size:13px}
.b td,.b th{border:1px solid var(--line);padding:4px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.chips button{background:#fff;border:1px solid var(--gold);color:#6e5520;border-radius:18px;padding:7px 12px;font-size:13px;cursor:pointer}
footer{border-top:1px solid var(--line);background:#fff;padding:10px}
form{display:flex;gap:8px;max-width:820px;margin:0 auto}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;height:46px;max-height:140px}
form button{background:var(--gold);color:#fff;border:0;border-radius:12px;padding:0 18px;font-size:15px;cursor:pointer}
form button:disabled{opacity:.5}
.note{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
#profile{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
#profile .card{background:#fff;border-radius:16px;padding:20px;max-width:440px;width:100%}
#profile h2{margin:0 0 4px;font-size:18px}
#profile p{margin:0 0 12px;color:var(--muted);font-size:13px}
#profile label{display:block;font-size:13px;margin:10px 0 4px}
#profile input,#profile textarea{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:14px}
#profile .row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
#profile .row button{border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:#fff;cursor:pointer}
#profile .row .ok{background:var(--navy);color:#fff;border:0}
.err{color:#a33}
</style>
</head>
<body>
<header>
  <div class="logo">全</div>
  <div><h1>全赢资本 · 股权教练</h1><p>3 天股权课学员专属 AI 助教</p></div>
  <button id="editProfile">我的公司资料</button>
</header>
<div id="chat"></div>
<footer>
  <form id="f">
    <textarea id="q" placeholder="问我任何关于股权分配、股权激励、融资的问题…"></textarea>
    <button id="send">发送</button>
  </form>
  <div class="note">AI 教练依据课程内容回答，仅供学习参考；法律、税务文件请咨询专业人士。</div>
</footer>

<div id="profile"><div class="card">
  <h2>先认识一下你的公司</h2>
  <p>填了之后，教练会针对你的情况回答（只存在你这台设备上，可以跳过）。</p>
  <label>行业 / 做什么生意</label><input id="p_ind" placeholder="例如：餐饮连锁，4 间分店">
  <label>年营业额 / 年净利润（大约）</label><input id="p_rev" placeholder="例如：营业额 RM500 万，净利润 RM60 万">
  <label>现在的股东和比例</label><input id="p_sh" placeholder="例如：我 70%，老同学 30%">
  <label>你现在最想解决的问题</label><textarea id="p_goal" rows="2" placeholder="例如：想留住两个核心店长，也想明年融资开新店"></textarea>
  <div class="row"><button id="p_skip">跳过</button><button class="ok" id="p_save">保存</button></div>
</div></div>

<script>
const KNOWLEDGE = __KNOWLEDGE__;
const INSTRUCTIONS = __INSTRUCTIONS__;
const $ = s => document.querySelector(s);
const chat = $('#chat');
let history = [];
let profile = {};
try { profile = JSON.parse(localStorage.getItem('coach_profile') || '{}'); } catch(e) {}

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function md(src){
  const lines = esc(src).split('\n'); let out=[], list=null, table=null;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const close=()=>{ if(list){out.push('</'+list+'>');list=null;} if(table){out.push('</table>');table=null;} };
  for (let l of lines){
    let m;
    if (/^\s*\|.*\|\s*$/.test(l)){ if(/^\s*\|[\s:|-]+\|\s*$/.test(l)) continue;
      if(!table){close();out.push('<table>');table=1;}
      out.push('<tr>'+l.trim().slice(1,-1).split('|').map(c=>'<td>'+inline(c.trim())+'</td>').join('')+'</tr>'); continue; }
    if ((m=l.match(/^#{1,4}\s+(.*)/))){close();out.push('<h3>'+inline(m[1])+'</h3>');continue;}
    if ((m=l.match(/^\s*[-*•]\s+(.*)/))){ if(list!=='ul'){close();out.push('<ul>');list='ul';} out.push('<li>'+inline(m[1])+'</li>');continue;}
    if ((m=l.match(/^\s*\d+[.)、]\s+(.*)/))){ if(list!=='ol'){close();out.push('<ol>');list='ol';} out.push('<li>'+inline(m[1])+'</li>');continue;}
    close(); if(l.trim()) out.push('<p>'+inline(l)+'</p>');
  }
  close(); return out.join('');
}
function add(role, html){
  const d=document.createElement('div'); d.className='msg '+role;
  const b=document.createElement('div'); b.className='b'; b.innerHTML=html; d.appendChild(b);
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return b;
}
function profileText(){
  const p=profile; if(!p.ind&&!p.rev&&!p.sh&&!p.goal) return '（学员没有填写公司资料，需要时请先询问。）';
  return `【这位学员的公司资料】\n行业：${p.ind||'未填'}\n营业额/利润：${p.rev||'未填'}\n股东结构：${p.sh||'未填'}\n最想解决的问题：${p.goal||'未填'}`;
}
function welcome(){
  const name = profile.ind ? `（${esc(profile.ind)}）` : '';
  add('bot', md(`你好，我是你的**全赢资本股权教练**${name} 👋\n\n课上学的股权分配、股权激励、融资、控股公司架构，套到你自己的公司上该怎么做，都可以问我。我会先了解你的情况，再陪你一步步想清楚。`));
  const c=document.createElement('div'); c.className='chips';
  ['我和合伙人一直 50:50，要怎么调整？','想给核心员工股份，又怕他们拿了就走','我有 3 间公司，需要成立控股公司吗？','单店融资的「优先回本」怎么设计？'].forEach(t=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=t; b.onclick=()=>{c.remove();ask(t);}; c.appendChild(b);
  });
  chat.appendChild(c);
}

let sample=null, busy=false;
(async()=>{ try{ sample = await claude.use('sample'); }catch(e){} if(!sample){ add('bot','<span class="err">这个页面现在连接不上 AI，请在 claude.ai 里打开这个网址再试。</span>'); $('#send').disabled=true; } })();

async function ask(text){
  if(busy||!text.trim()) return;
  if(!sample){ return; }
  busy=true; $('#send').disabled=true;
  add('user', esc(text));
  history.push({role:'user',content:text});
  const bubble = add('bot','<span style="color:#999">教练思考中…</span>');
  const preface = INSTRUCTIONS + '\n\n' + KNOWLEDGE + '\n\n' + profileText() + '\n\n—— 以下是学员的提问 ——\n';
  const msgs = history.map((m,i)=> i===0 ? {role:'user',content:preface+m.content} : m);
  try{
    const r = await sample(msgs,{cache:false,onText:({text})=>{bubble.innerHTML=md(text);chat.scrollTop=chat.scrollHeight;}});
    bubble.innerHTML = md(r.text);
    history.push({role:'assistant',content:r.text});
  }catch(e){
    history.pop();
    bubble.innerHTML = '<span class="err">'+(e&&e.code==='rate_limited'?'问得有点快了，请稍等一下再问。':e&&e.code==='not_granted'?'需要先允许这个页面使用 Claude，请重新整理页面后点「允许」。':'刚才没有回答成功，请再发一次。')+'</span>';
  }
  busy=false; $('#send').disabled=false; chat.scrollTop=chat.scrollHeight;
}
$('#f').addEventListener('submit',e=>{e.preventDefault();const t=$('#q').value;$('#q').value='';ask(t);});
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#f').requestSubmit();} });

function openProfile(){ $('#p_ind').value=profile.ind||'';$('#p_rev').value=profile.rev||'';$('#p_sh').value=profile.sh||'';$('#p_goal').value=profile.goal||''; $('#profile').style.display='flex'; }
function closeProfile(){ $('#profile').style.display='none'; try{localStorage.setItem('coach_seen','1')}catch(e){} }
$('#editProfile').onclick=openProfile;
$('#p_skip').onclick=closeProfile;
$('#p_save').onclick=()=>{ profile={ind:$('#p_ind').value.trim(),rev:$('#p_rev').value.trim(),sh:$('#p_sh').value.trim(),goal:$('#p_goal').value.trim()}; try{localStorage.setItem('coach_profile',JSON.stringify(profile))}catch(e){} closeProfile(); add('bot',md('收到，我已经记下你的公司资料，接下来的回答都会针对你的情况。')); };

welcome();
let seen=false; try{seen=localStorage.getItem('coach_seen')}catch(e){}
if(!seen) openProfile();
</script>
</body>
</html>
