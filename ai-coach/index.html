值一定的折扣为基础计算（70%-50%）\n• 公司可在行权前协议回购是按于行权价格的多少倍数回购\n• 如公司不回购，则由被授予人继续持有或对外转让\n过错离职回购\n• 未行权的期权立即终止行权；\n• 对于已行权的期权，公司有权按照授予时同等价格将全部转让\n 回公司或指定主体。\n\f回购机制&回购价格\n锁定期为3年，在锁定期内离职公司将统一原价回购\n锁定期后的离职退出将分成以下两种形式\n无过错离职回购 -（职员向管理层申请离职并获得同意）\n锁定激活后 - 回购方式（按照原价回购所有股权）\n锁定激活后 - 回购方式（过去NP x 固定P/E 4）\n如公司选择不回购，持有人将可持续持有该公司股权\n过错离职回购 -（职员经过犯错被公司辞退）\n未行权的期权立刻终止\n对已经行权的，将按照当时行权价格全部回购，并辞退职员\n\f 离职退出回购价格参考\nè 原价 （当初进入的价格）\nè 倍数 （事先约定的倍数 x1 or x2）\nè 原价+利息 （原价 + 3% - 5%）\nè 估值 （公司最新的估值）\nè 估值折价 （最新估值的打折）\nè 净资产 （公司的净资产）\n\f 退出方式\n假设 - 员工无过错离职的情况\n如果该员工已激活的股权为 1%\n锁定激活后3年期限内的回购方式\n可按原价回购，或者按原价+利息的来回购\n锁定后3年期限后\n可过去一年的净利润 x 固定P/E 4 = 公司估值 x 股权比例 = 价格\n(800K x P/E 4 = 320万） x 1% = 3.2万回购\n如按最新估值计算并低于行权价格，则按行权原价回购\n\f第八步：回收条件\n\f进入机制 VS 退出机制\n 进入有条件 退出有方法\n 条件有考核 方法有约束\n能进又能退的才是正确的股权激励模式\n\f 股权激励八步法\n （某健康坚果企业）\n 2016 ECF估值\n当时激励计划 5%的股权 投100k\n 约20mil\n 5%股权 按新估值 目前5mil\n 目前估值约\n 价格约100k 约5mil 等于 = 50倍\n 100mil\n\f 采用 ESOS (员工持股计划) 模式。\nStep 1 激励形势 不直接给原始股，而是授予“期权”，\n 这确保了员工必须与公司共同成长才能获得收益，降低了公司的法律风险。\n 早期通过员工持股平台直接代持，后期方便对接资本\nStep 2 持股方式\n 市场/集中决策权。\n “二八原则”精选： 核心高管COO、互联网运营大将、供应链核心负责\nStep 3 授予对象\n 人。\nStep 4 授予数量 核心高管COO直接以公司5%来激励\n\f 行权价格设定通常采取 “折扣法”。\nStep 5 行权价格 员工以远低于市场估值的价格获得期权，产生巨大的“价格锚点”诱惑。\n （比如市场估值10m，现在可以打折80% = 2mil估值 x 5% = 100k）\n “金手铐”机制，5%比例分为4年激活，等于每年激活1.25%。\nStep 6 成熟计划\n 搭配每年特定的KPI完成才能激活\n 若4年年正常离职，未激活比例作废，已激活比例以原价回购所有权\nStep 7 回购价格\n 若在职期间，是过错而离职，未激活作废，已激活股份将以RM1回购所\n 有权\nStep 8 回收机制 若已不能胜任工作岗位、或发生意外、无法胜任工作\n 或失职、损害公司利益、被追究法律责任等过去，都将回收所有权\n\f 你把公司当成是你的，你就要操心\n你把公司变成是大家的，大家就会操心\n\f 企业无论大小\n拥有“极致利他”的思维非常重要\n想要长期利益，首先要放弃眼前利益\n想要收获价值，首先要学会创造价值\n想要速成捷径，首先要放弃速成捷径\n想要赚取财富，首先要能够舍得分钱\n";

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function md(src){
  const lines = esc(src).split('\n'); let out=[], list=null, table=null;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const close=()=>{ if(list){out.push('</'+list+'>');list=null;} if(table){out.push('</table>');table=null;} };
  for (let l of lines){
    let m;
    if (/^\s*\|.*\|\s*$/.test(l)){ if(/^\s*\|[\s:|-]+\|\s*$/.test(l)) continue;
      if(!table){close();out.push('<table>');table=1;}
      out.push('<tr>'+l.trim().slice(1,-1).split('|').map(c=>'<td>'+inline(c.trim())+'</td>').join('')+'</tr>'); continue; }
    if ((m=l.match(/^#{1,4}\s+(.*)/))){close();out.push('<h3>'+inline(m[1])+'</h3>');continue;}
    if ((m=l.match(/^\s*[-*•]\s+(.*)/))){ if(list!=='ul'){close();out.push('<ul>');list='ul';} out.push('<li>'+inline(m[1])+'</li>');continue;}
    if ((m=l.match(/^\s*\d+[.)、]\s+(.*)/))){ if(list!=='ol'){close();out.push('<ol>');list='ol';} out.push('<li>'+inline(m[1])+'</li>');continue;}
    close(); if(l.trim()) out.push('<p>'+inline(l)+'</p>');
  }
  close(); return out.join('');
}

function profileText(){
  const p=profile; if(!p.ind&&!p.rev&&!p.sh&&!p.goal) return '（学员没有填写公司资料，需要时请先询问。）';
  return `【这位学员的公司资料】\n行业：${p.ind||'未填'}\n营业额/利润：${p.rev||'未填'}\n股东结构：${p.sh||'未填'}\n最想解决的问题：${p.goal||'未填'}`;
}
function welcome(){
  const name = profile.ind ? `（${esc(profile.ind)}）` : '';
  add('bot', md(`你好，我是你的**全赢资本股权教练**${name} 👋\n\n课上学的股权分配、股权激励、融资、控股公司架构，套到你自己的公司上该怎么做，都可以问我。我会先了解你的情况，再陪你一步步想清楚。`));
  const c=document.createElement('div'); c.className='chips';
  ['我和合伙人一直 50:50，要怎么调整？','想给核心员工股份，又怕他们拿了就走','我有 3 间公司，需要成立控股公司吗？','单店融资的「优先回本」怎么设计？'].forEach(t=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=t; b.onclick=()=>{c.remove();ask(t);}; c.appendChild(b);
  });
  chat.appendChild(c);
}

let sample=null, busy=false;
(async()=>{ try{ sample = await claude.use('sample'); }catch(e){} if(!sample){ add('bot','<span class="err">这个页面现在连接不上 AI，请在 claude.ai 里打开这个网址再试。</span>'); $('#send').disabled=true; } })();

async function ask(text){
  if(busy||!text.trim()) return;
  if(!sample){ return; }
  busy=true; $('#send').disabled=true;
  add('user', esc(text));
  history.push({role:'user',content:text});
  const bubble = add('bot','<span style="color:#999">教练思考中…</span>');
  const preface = INSTRUCTIONS + '\n\n' + KNOWLEDGE + '\n\n' + profileText() + '\n\n—— 以下是学员的提问 ——\n';
  const msgs = history.map((m,i)=> i===0 ? {role:'user',content:preface+m.content} : m);
  try{
    const r = await sample(msgs,{cache:false,onText:({text})=>{bubble.innerHTML=md(text);chat.scrollTop=chat.scrollHeight;}});
    bubble.innerHTML = md(r.text);
    history.push({role:'assistant',content:r.text});
  }catch(e){
    history.pop();
    bubble.innerHTML = '<span class="err">'+(e&&e.code==='rate_limited'?'问得有点快了，请稍等一下再问。':e&&e.code==='not_granted'?'需要先允许这个页面使用 Claude，请重新整理页面后点「允许」。':'刚才没有回答成功，请再发一次。')+'</span>';
  }
  busy=false; $('#send').disabled=false; chat.scrollTop=chat.scrollHeight;
}
$('#f').addEventListener('submit',e=>{e.preventDefault();const t=$('#q').value;$('#q').value='';ask(t);});
$('#q').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#f').requestSubmit();} });

function openProfile(){ $('#p_ind').value=profile.ind||'';$('#p_rev').value=profile.rev||'';$('#p_sh').value=profile.sh||'';$('#p_goal').value=profile.goal||''; $('#profile').style.display='flex'; }
function closeProfile(){ $('#profile').style.display='none'; try{localStorage.setItem('coach_seen','1')}catch(e){} }
$('#editProfile').onclick=openProfile;
$('#p_skip').onclick=closeProfile;
$('#p_save').onclick=()=>{ profile={ind:$('#p_ind').value.trim(),rev:$('#p_rev').value.trim(),sh:$('#p_sh').value.trim(),goal:$('#p_goal').value.trim()}; try{localStorage.setItem('coach_profile',JSON.stringify(profile))}catch(e){} closeProfile(); add('bot',md('收到，我已经记下你的公司资料，接下来的回答都会针对你的情况。')); };

welcome();
let seen=false; try{seen=localStorage.getItem('coach_seen')}catch(e){}
if(!seen) openProfile();
</script>
</body>
</html>
