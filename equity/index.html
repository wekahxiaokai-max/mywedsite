<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>员工股权激励管理后台</title>
<style>
:root{
  --brand:#E8792F; --brand2:#FBE3D2; --brand3:#FFF6EF;
  --ink:#1d1d1b; --ink2:#52514e; --mut:#8a8984; --line:#e6e5e1; --bg:#f4f4f1; --card:#fff;
  --side:#1f2328; --side2:#2b3036;
  --s1:#2a78d6; --s2:#1baf7a; --s3:#eda100; --rest:#d9d8d3;
  --ok:#1f8a4c; --okbg:#e7f5ec; --warn:#a85a07; --warnbg:#fff3e0; --bad:#b42318; --badbg:#fdecea; --info:#1f5fa8; --infobg:#e9f1fb;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.55}
.app{display:flex;min-height:100vh}
nav{width:212px;background:var(--side);color:#cfd3d8;flex-shrink:0;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav .logo{color:#fff;font-weight:700;font-size:16px;padding:4px 10px 2px}
nav .logo small{display:block;color:#8b939c;font-weight:400;font-size:12px}
nav .grp{font-size:11px;color:#7d858e;margin:16px 10px 6px;letter-spacing:.05em}
nav a{display:flex;align-items:center;gap:8px;color:#cfd3d8;text-decoration:none;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:14px}
nav a:hover{background:var(--side2);color:#fff}
nav a.on{background:var(--brand);color:#fff}
nav a .badge{margin-left:auto;background:#e5484d;color:#fff;border-radius:9px;font-size:11px;padding:0 6px}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.top select,.top input{width:auto}
.top .save{margin-left:auto;font-size:12px;color:var(--mut)}
main{padding:20px 22px 60px}
h1{font-size:21px;margin:0 0 2px}
.sub{color:var(--ink2);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .act{margin-left:auto;display:flex;gap:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.cols{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card .kpi{background:#fafaf8}
.kpi small{display:block;color:var(--ink2);font-size:12px}
.kpi b{display:block;font-size:21px;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi span{font-size:12px;color:var(--mut)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--ink2);font-weight:600;background:#fafaf8;white-space:nowrap}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;background:var(--brand3)}
tr.click{cursor:pointer} tr.click:hover td{background:#fbfaf7}
.tw{overflow-x:auto}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:6px;padding:6px 13px;cursor:pointer;font-size:13px;white-space:nowrap;font-family:inherit}
.btn:hover{filter:brightness(.96)}
.btn.g{background:#fff;color:var(--brand)}
.btn.n{background:#fff;color:var(--ink2);border-color:#ccc}
.btn.d{background:#fff;color:var(--bad);border-color:#e3c3c0}
.btn.sm{padding:3px 9px;font-size:12px}
input,select,textarea{font:inherit;font-size:13px;padding:6px 8px;border:1px solid #cfcfca;border-radius:6px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand2);border-color:var(--brand)}
input:disabled{background:#f6f6f3;color:var(--ink2)}
input[type=checkbox]{width:auto}
textarea{min-height:110px;font-family:monospace;font-size:12px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2)}
.f .h{color:var(--mut);font-size:11px}
.pill{display:inline-block;border-radius:10px;padding:0 8px;font-size:12px;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)} .p-warn{background:var(--warnbg);color:var(--warn)} .p-bad{background:var(--badbg);color:var(--bad)}
.p-info{background:var(--infobg);color:var(--info)} .p-mut{background:#efefec;color:var(--ink2)}
.note{border-radius:8px;padding:9px 12px;margin:8px 0;font-size:13px}
.n-ok{background:var(--okbg);color:var(--ok)} .n-warn{background:var(--warnbg);color:var(--warn)} .n-bad{background:var(--badbg);color:var(--bad)} .n-info{background:var(--infobg);color:var(--info)}
.n-tip{background:var(--brand3);color:#7a3c10;border-left:3px solid var(--brand)}
.mut{color:var(--mut);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.empty{color:var(--mut);text-align:center;padding:26px 10px}
.formula{background:#f6f6f3;border-radius:6px;padding:7px 11px;font-size:12px;color:var(--ink2);margin:6px 0}
.modalbg{position:fixed;inset:0;background:rgba(20,20,20,.38);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:20;overflow:auto}
.modal{background:#fff;border-radius:12px;width:min(940px,100%);padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h2{margin:0 0 4px;font-size:18px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
.sec{font-size:13px;font-weight:700;margin:18px 0 8px;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:4px}
.stack{display:flex;height:22px;border-radius:4px;overflow:hidden;gap:2px;background:#fff}
.stack div{height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:150px 1fr 90px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.hbar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .t{height:14px;background:#f0efeb;border-radius:0 4px 4px 0}
.hbar .t div{height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums}
.colchart{display:flex;align-items:flex-end;gap:10px;height:150px;border-bottom:1px solid #cfcfca;padding:0 4px}
.colchart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.colchart .bar{width:60%;max-width:46px;background:var(--s1);border-radius:4px 4px 0 0;min-height:2px}
.colchart span{font-size:11px;color:var(--ink2);margin-bottom:3px;font-variant-numeric:tabular-nums}
.colx{display:flex;gap:10px;padding:4px 4px 0}
.colx div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
#tip{position:fixed;pointer-events:none;background:#1d1d1b;color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;display:none;z-index:50;white-space:nowrap}
.steps{display:flex;margin:6px 0 14px;flex-wrap:wrap;gap:2px}
.steps div{padding:4px 12px;font-size:12px;background:var(--brand2);color:#7a3c10}
.steps div:first-child{border-radius:12px 0 0 12px}.steps div:last-child{border-radius:0 12px 12px 0}
.welcome{max-width:760px;margin:50px auto;text-align:center}
.welcome h1{font-size:26px}
.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:22px 0;text-align:left}
.flow div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--ink2)}
.flow b{display:block;color:var(--ink);font-size:13px}
pre.doc{white-space:pre-wrap;font-family:inherit;background:#fafaf8;padding:12px;border-radius:8px;margin:0;font-size:13px}
@media(max-width:860px){.app{flex-direction:column}nav{width:auto;height:auto;position:static;display:flex;flex-wrap:wrap;gap:2px}nav .grp,nav .logo small{display:none}main{padding:14px}}
@media print{nav,.top,.noprint{display:none!important}main{padding:0}.card{border:0}}
</style>
</head>
<body>
<div class="app">
  <nav id="nav"></nav>
  <div class="mainwrap">
    <div class="top noprint">
      <label class="row" style="gap:6px"><span class="mut">客户公司</span><select id="coSel"></select></label>
      <button class="btn g sm" id="newCo">＋ 新公司</button>
      <button class="btn n sm" id="demoCo">载入示范公司</button>
      <label class="row" style="gap:6px" title="系统按这个日期计算成熟、年资。改成未来的日期，就能模拟几年后的情况。"><span class="mut">计算日期</span><input type="date" id="asOf"></label>
      <span class="save" id="saveState">载入中…</span>
    </div>
    <main id="main"></main>
  </div>
</div>
<div id="modal"></div>
<div id="tip"></div>

<script>
"use strict";
/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const RM = n => (n < -0.5 ? "-RM " : "RM ") + Math.round(Math.abs(n)).toLocaleString("en-US");
const RM2 = n => "RM " + (Math.round(n * 100) / 100).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
const PCT = (f, d = 2) => { if (!isFinite(f)) return "0%"; let t = (f * 100).toFixed(d); if (t.includes(".")) t = t.replace(/\.?0+$/, ""); return t + "%"; };
const INT = n => Math.round(n).toLocaleString("en-US");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayISO = () => new Date().toISOString().slice(0, 10);
const addYears = (d, n) => { const x = new Date(d + "T00:00:00Z"); if (isNaN(x)) return d; x.setUTCFullYear(x.getUTCFullYear() + n); return x.toISOString().slice(0, 10); };
const yearsBetween = (a, b) => (!a || !b) ? 0 : (new Date(b) - new Date(a)) / (365.25 * 864e5);
const clone = o => JSON.parse(JSON.stringify(o));
function getPath(o, p){ return p.split(".").reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, v){
  const ks = p.split("."); let c = o;
  for (let i = 0; i < ks.length - 1; i++){ if (c[ks[i]] == null) c[ks[i]] = /^\d+$/.test(ks[i+1]) ? [] : {}; c = c[ks[i]]; }
  c[ks[ks.length-1]] = v;
}

/* ================= 字典 ================= */
const PLAN_TYPES = {
  virtual:{t:"虚拟分红股（红股）", s:"红股", d:"员工买的是「分红权」，不登记 SSM、不稀释股权。适合门店、项目、分公司。"},
  rsu:{t:"实股（限制性股份）", s:"实股", d:"员工出钱买真股份，成为股东。设锁定期和回购条款，离职可以收回。"},
  option:{t:"期权（期股 / ESOS）", s:"期权", d:"约定将来用优惠价买股份，成熟后才能「行权」（付钱买）。适合计划上市的公司。"}
};
const VEHICLES = {
  platform:{t:"持股平台（LLP / Sdn Bhd）", d:"员工股份装进一间平台公司，SSM 只多一个股东，投票权由创始人控制。人多时首选。"},
  proxy:{t:"创始人代持", d:"由创始人代员工持有，投票权在创始人。人少或红股适合，要签代持协议。"},
  direct:{t:"员工直接持有", d:"员工名字直接登记在 SSM，投票权分散。只适合极少数核心合伙人。"}
};
const VAL_METHODS = {pe:"净利润 × 市盈率", funding:"最新融资估值", assets:"净资产", manual:"自定数字"};
const PRICE_BASES = {valuation:"按公司估值打折", assets:"按净资产打折", fixed:"固定每股价格"};
const BUY_METHODS = {original:"原价", interest:"原价 + 每年利息", multiple:"原价 × 约定倍数", pe:"最近净利润 × 固定市盈率", valuation:"最新估值", valuationDiscount:"最新估值打折", assets:"净资产"};
const EXIT_CATS = {
  A:{t:"一般离职", s:"按计划的回购规则", items:["主动辞职并经公司同意","劳动合同期满不续约","不能胜任工作","非因公死亡或丧失劳动能力"]},
  B:{t:"非员工原因离开", s:"按市场价或较高回报，取较高者", items:["公司战略调整要求离职","退休","因公丧失劳动能力或死亡","主动要求结束激励计划"]},
  C:{t:"过错离职", s:"未成熟作废，已成熟原价或低价回购 + 赔偿", items:["违反公司制度被辞退","严重失职、擅自离职","侵占公司财产、泄露商业机密","触犯法律被追究责任"]}
};
const PERF = {A:"A 优秀", B:"B 良好", C:"C 合格", D:"D 不合格"};
const GSTATUS = {draft:["草稿","p-mut"], active:["生效中","p-ok"], ended:["已结束","p-info"]};

/* ================= 资料结构 ================= */
function defaultLevels(){
  return [
    {id:"L1", name:"C Level（CEO/COO/CFO/CMO）", coef:3, minYears:0},
    {id:"L2", name:"核心高管（部门负责人）", coef:2, minYears:0},
    {id:"L3", name:"项目红点（店长/厂长/分店经理）", coef:1.5, minYears:0},
    {id:"L4", name:"总监", coef:1.5, minYears:5},
    {id:"L5", name:"经理", coef:1, minYears:3},
    {id:"L6", name:"骨干员工", coef:0.6, minYears:3}
  ];
}
function newCompany(name){
  return {id:uid(), name:name || "新客户公司", industry:"", regNo:"", createdAt:Date.now(), updatedAt:Date.now(),
    valuations:[], shareholders:[{id:uid(), name:"创始人", type:"founder", shares:100000}],
    levels:defaultLevels(), perfCoef:{A:1.2, B:1, C:0.8, D:0}, tenureCoef:[0.8, 1, 1.1, 1.2],
    participants:[], plans:[], grants:[], payments:[], dividends:[], log:[]};
}
function newPlan(c){
  return {id:uid(), name:`${S.asOf.slice(0,4)} 核心团队激励计划`, type:"rsu", vehicle:"platform", vehicleName:"",
    pool:Math.round(issuedShares(c) * 0.1), priceBase:"valuation", discount:50, fixedPrice:0,
    vestYears:4, vestMode:"ascending", vestCustom:[10,20,30,40], perf:false, perfRule:"ratio", perfThreshold:80,
    lockYears:3, buy:{inLock:"original", afterLock:"pe", rate:5, pe:4, multiple:2, valDisc:50, floor:true, highRate:8},
    vSchedule:true, vTerm:5, vBonus:20, startDate:S.asOf, status:"active"};
}
function newParticipant(){ return {id:uid(), name:"", dept:"", position:"", levelId:"L5", joinDate:S.asOf, salary:0, perf:"B", status:"active", leftDate:"", ic:"", phone:""}; }
function newGrant(c, pl, pid, shares){ return {id:uid(), planId:pl.id, pid, date:S.asOf, shares, price:Math.round(planPrice(c, pl, S.asOf)*100)/100, status:"draft", payMode:"cash", perf:[], exercised:0, paid:0, loan:0, note:""}; }

/* ================= 计算核心 ================= */
const issuedShares = c => c.shareholders.reduce((s, h) => s + num(h.shares), 0);
const valOf = v => !v ? 0 : v.method === "pe" ? num(v.netProfit) * num(v.pe) : v.method === "funding" ? num(v.funding) : v.method === "assets" ? num(v.netAssets) : num(v.manual);
function latestVal(c, asOf){ return c.valuations.filter(v => !asOf || v.date <= asOf).sort((a, b) => a.date < b.date ? 1 : -1)[0] || null; }
const valuationAt = (c, d) => valOf(latestVal(c, d));
const pps = (c, d) => { const i = issuedShares(c); return i ? valuationAt(c, d) / i : 0; };
function planPrice(c, pl, date){
  const i = issuedShares(c); if (!i || !pl) return 0;
  if (pl.priceBase === "fixed") return num(pl.fixedPrice);
  const lv = latestVal(c, date);
  return (pl.priceBase === "assets" ? num(lv?.netAssets) : valOf(lv)) / i * (1 - num(pl.discount) / 100);
}
const getPlan = (c, id) => c.plans.find(p => p.id === id);
const getP = (c, id) => c.participants.find(p => p.id === id);
const levelOf = (c, id) => c.levels.find(l => l.id === id) || {name:"(未设定)", coef:1, minYears:0};
function weights(pl){
  const n = Math.max(1, Math.min(10, Math.round(num(pl.vestYears)) || 1));
  if (pl.vestMode === "even") return Array.from({length:n}, () => 1 / n);
  if (pl.vestMode === "ascending"){ const s = n * (n + 1) / 2; return Array.from({length:n}, (_, i) => (i + 1) / s); }
  return Array.from({length:n}, (_, i) => num((pl.vestCustom || [])[i]) / 100);
}
const tenure = (p, d) => yearsBetween(p.joinDate, p.status === "left" && p.leftDate ? p.leftDate : d);
function tenureCoef(c, y){ const t = c.tenureCoef || [0.8,1,1.1,1.2]; return num(y < 1 ? t[0] : y < 3 ? t[1] : y < 5 ? t[2] : t[3]); }
function eligibility(c, p, d){
  if (p.status === "left") return {ok:false, t:"已离职"};
  if (p.perf === "D") return {ok:false, t:"考核不合格"};
  const L = levelOf(c, p.levelId), y = tenure(p, d);
  if (y + 1e-9 < num(L.minYears)) return {ok:false, t:`年资 ${y.toFixed(1)} 年，未满 ${L.minYears} 年`};
  return {ok:true, t:"符合资格"};
}
const score = (c, p, d) => num(levelOf(c, p.levelId).coef) * num((c.perfCoef || {})[p.perf] ?? 1) * tenureCoef(c, tenure(p, d));

/* 一笔授予的成熟时间表 */
function vestInfo(c, g, asOf){
  const pl = getPlan(c, g.planId) || {}, W = weights(pl);
  const endDate = g.status === "ended" && g.end ? g.end.date : null;
  let vested = 0, lost = 0, pending = 0, future = 0;
  const events = W.map((w, i) => {
    const date = addYears(g.date, i + 1), sh = num(g.shares) * w;
    if (g.status === "draft"){ future += sh; return {date, w, sh, st:"未生效", cls:"p-mut"}; }
    if (endDate && date > endDate) return {date, w, sh, st:"离职已处理", cls:"p-mut", gone:true};
    if (pl.perf){
      const r = (g.perf || [])[i] || {}, t = num(r.target), a = r.actual;
      if (a === "" || a == null){
        if (date <= asOf){ pending += sh; return {date, w, sh, st:"待确认考核", cls:"p-warn"}; }
        future += sh; return {date, w, sh, st:"未到期", cls:"p-mut"};
      }
      const ratio = t ? num(a) / t : 1;
      const f = pl.perfRule === "ratio" ? (ratio >= num(pl.perfThreshold) / 100 ? Math.min(1, ratio) : 0) : (ratio >= 1 ? 1 : 0);
      if (date > asOf){ future += sh * f; lost += sh * (1 - f); return {date, w, sh, st:`已考核（完成 ${PCT(ratio,0)}），到期成熟`, cls:"p-info"}; }
      vested += sh * f; lost += sh * (1 - f);
      return {date, w, sh, f, st: f >= 1 ? `已成熟（完成 ${PCT(ratio,0)}）` : f > 0 ? `成熟 ${PCT(f,0)}（完成 ${PCT(ratio,0)}）` : `未达标作废（完成 ${PCT(ratio,0)}）`, cls: f >= 1 ? "p-ok" : f > 0 ? "p-warn" : "p-bad"};
    }
    if (date <= asOf){ vested += sh; return {date, w, sh, st:"已成熟", cls:"p-ok"}; }
    future += sh; return {date, w, sh, st:"未到期", cls:"p-mut"};
  });
  return {events, vested, lost, pending, future};
}

/* 离职回购计算 */
function exitCalc(c, g, o){
  const pl = getPlan(c, g.planId), b = pl.buy, lines = [];
  const vi = vestInfo(c, {...g, status:"active", end:null}, o.date);
  const Y = Math.max(1, Math.ceil(yearsBetween(g.date, o.date) - 1e-9));
  let vested = vi.vested, unvested = Math.max(0, num(g.shares) - vi.vested - vi.lost);
  if (vi.lost > 0) lines.push(`业绩没达标已作废 ${INT(vi.lost)} 股，回到股权池`);
  if (vi.pending > 0) lines.push(`还有 ${INT(vi.pending)} 股考核结果没填，暂当作未成熟`);
  if (o.cat === "B" && o.accel && unvested > 0){ lines.push(`非员工原因离开：未成熟的 ${INT(unvested)} 股提前成熟`); vested += unvested; unvested = 0; }
  const price = num(g.price), isOpt = pl.type === "option", costV = vested * price;
  const lv = latestVal(c, o.date), issued = issuedShares(c);
  const has = v => v !== "" && v != null;
  const np = has(o.np) ? num(o.np) : num(lv?.netProfit), V = has(o.val) ? num(o.val) : valOf(lv), na = num(lv?.netAssets);
  const pctV = issued ? vested / issued : 0;
  const mv = m => ({original:costV, interest:costV * (1 + num(b.rate)/100 * Y), multiple:costV * num(b.multiple),
    pe:np * num(b.pe) * pctV, valuation:V * pctV, valuationDiscount:V * pctV * (1 - num(b.valDisc)/100), assets:na * pctV})[m] || 0;
  const inLock = Y <= num(pl.lockYears);
  let buyback = 0, refund = 0, comp = 0, deduct = 0, kept = 0;
  if (pl.type === "virtual" && pl.vSchedule){
    const cost = num(g.shares) * price, term = Math.max(1, num(pl.vTerm));
    buyback = Y <= term ? cost * Y / term : cost * (1 + num(pl.vBonus)/100);
    lines.push(Y <= term ? `红股回购表：持有第 ${Y} 年离开 = 买入价 ${RM(cost)} × ${Y}/${term}` : `红股回购表：满 ${term} 年后离开 = 买入价 + ${pl.vBonus}% 奖励`);
    vested = num(g.shares); unvested = 0;
    if (o.cat === "C"){ buyback *= num(o.faultPct)/100; comp = num(o.comp); lines.push(`过错离职：只按 ${o.faultPct}% 回购`); }
  } else if (o.cat === "C"){
    buyback = costV * num(o.faultPct)/100;
    lines.push(`过错离职：未成熟部分立刻作废；已成熟 ${INT(vested)} 股按${isOpt?"行权价":"原价"}的 ${o.faultPct}% 回购 = ${RM(buyback)}`);
    if (!isOpt && unvested > 0) refund = unvested * price * num(o.faultPct)/100;
    comp = num(o.comp);
  } else if (o.keep){
    kept = vested; lines.push(`公司选择不回购：员工继续持有已成熟的 ${INT(vested)} 股`);
    if (!isOpt && unvested > 0) refund = unvested * price;
  } else {
    const m = inLock ? b.inLock : b.afterLock;
    let v = mv(m);
    lines.push(`${inLock ? `锁定期内（持有第 ${Y} 年，锁定 ${pl.lockYears} 年）` : `已过锁定期（持有第 ${Y} 年）`}：按「${BUY_METHODS[m]}」= ${RM(v)}`);
    if (m === "pe") lines.push(`　＝ 净利润 ${RM(np)} × ${b.pe} 倍 × 已成熟股权 ${PCT(pctV,3)}`);
    if (b.floor && v < costV){ lines.push(`低于${isOpt?"行权价":"原价"} ${RM(costV)}，按原价保底`); v = costV; }
    if (o.cat === "B"){ const hi = costV * (1 + num(b.highRate)/100 * Y); if (hi > v){ lines.push(`较高回报 ${b.highRate}%/年 = ${RM(hi)}，取较高者`); v = hi; } }
    buyback = v;
    if (!isOpt && unvested > 0) refund = unvested * price;
  }
  if (isOpt && !kept){
    const notEx = Math.max(0, vested - num(g.exercised));
    if (notEx > 0 && buyback > 0){ deduct = Math.min(notEx * price, buyback); lines.push(`其中 ${INT(notEx)} 股还没行权（员工没付钱），扣掉行权款 ${RM(deduct)}`); }
  }
  if (isOpt && unvested > 0) lines.push(`未成熟的 ${INT(unvested)} 股期权自动失效（员工没付钱，公司也不用付）`);
  if (!isOpt && refund > 0) lines.push(`未成熟的 ${INT(unvested)} 股按${o.cat==="C"?` ${o.faultPct}% `:""}原价退款 ${RM(refund)}`);
  const loan = num(g.loan);
  if (loan > 0.5) lines.push(`扣除员工尚欠的入股欠款 ${RM(loan)}`);
  if (comp > 0) lines.push(`扣除员工应赔偿公司的损失 ${RM(comp)}`);
  return {Y, vested, unvested, lost:vi.lost, buyback, refund, deduct, loan, comp, kept, lines, inLock, total:buyback + refund - deduct - loan - comp};
}

/* 有投票权、有分红的真股份 */
function realShares(c, g){
  const pl = getPlan(c, g.planId); if (!pl || pl.type === "virtual") return 0;
  if (g.status === "active") return pl.type === "option" ? num(g.exercised) : num(g.shares);
  if (g.status === "ended" && g.end) return num(g.end.kept);
  return 0;
}

/* 全公司汇总 */
function summary(c, asOf){
  const issued = issuedShares(c), V = valuationAt(c, asOf), P = issued ? V / issued : 0;
  const plans = c.plans.map(pl => {
    const gs = c.grants.filter(g => g.planId === pl.id);
    let active = 0, draft = 0, vested = 0, kept = 0;
    gs.forEach(g => {
      if (g.status === "draft") draft += num(g.shares);
      else if (g.status === "active"){ active += num(g.shares); vested += vestInfo(c, g, asOf).vested; }
      else if (g.end) kept += num(g.end.kept);
    });
    const used = active + draft + kept;
    return {pl, gs, active, draft, vested, kept, used, avail:num(pl.pool) - used};
  });
  const empReal = c.grants.reduce((s, g) => s + realShares(c, g), 0);
  const ctrlEmp = c.grants.reduce((s, g) => { const pl = getPlan(c, g.planId); return s + (pl && pl.vehicle !== "direct" ? realShares(c, g) : 0); }, 0);
  const realPlans = c.plans.filter(p => p.type !== "virtual");
  const fdPool = realPlans.reduce((s, p) => s + num(p.pool), 0);
  const founder = c.shareholders.filter(h => h.type === "founder").reduce((s, h) => s + num(h.shares), 0);
  const totalNow = issued + empReal;
  const vote = totalNow ? (founder + ctrlEmp) / totalNow : 0;
  const voteFD = issued + fdPool ? (founder + realPlans.filter(p => p.vehicle !== "direct").reduce((s, p) => s + num(p.pool), 0)) / (issued + fdPool) : 0;
  const activeGrants = c.grants.filter(g => g.status === "active");
  let empValue = 0, empCost = 0;
  activeGrants.forEach(g => { empValue += num(g.shares) * P; empCost += num(g.shares) * num(g.price); });
  const people = new Set(activeGrants.map(g => g.pid)).size;
  const alerts = [];
  if (!c.valuations.length) alerts.push(["bad","还没有公司估值。去「公司估值」新增一笔，所有价格都靠它计算。","valuation"]);
  if (!issued) alerts.push(["bad","股东名册还没有股数。去「股权结构」填写。","captable"]);
  plans.forEach(x => { if (x.avail < -0.5) alerts.push(["bad",`「${x.pl.name}」授予超过股权池 ${INT(-x.avail)} 股。`,"plans"]); });
  if (founder && totalNow){
    if (vote < 0.5) alerts.push(["bad",`创始人目前能控制的投票权只有 ${PCT(vote)}，低于 50%，失去控制权。`,"captable"]);
    else if (vote < 0.75) alerts.push(["warn",`创始人能控制的投票权 ${PCT(vote)}，低于 75%（马来西亚公司法「特别决议」门槛，例如改章程、增资）。`,"captable"]);
    else if (voteFD < 0.75) alerts.push(["warn",`如果股权池全部发出去，创始人投票权会降到 ${PCT(voteFD)}，低于 75%。`,"captable"]);
  }
  let pendingPerf = 0;
  activeGrants.forEach(g => vestInfo(c, g, asOf).events.forEach(e => { if (e.st === "待确认考核") pendingPerf++; }));
  if (pendingPerf) alerts.push(["warn",`有 ${pendingPerf} 笔成熟等着填业绩考核结果。`,"vesting"]);
  const drafts = c.grants.filter(g => g.status === "draft").length;
  if (drafts) alerts.push(["info",`有 ${drafts} 笔授予还是草稿，签约后记得点「签约生效」。`,"grants"]);
  activeGrants.forEach(g => { const p = getP(c, g.pid); if (p && p.status === "left") alerts.push(["bad",`${p.name} 已标记离职，但授予还在生效，请到「退出回购」办理。`,"exits"]); });
  return {issued, V, P, plans, empReal, fdPool, founder, vote, voteFD, empValue, empCost, people, alerts, activeGrants, totalNow};
}

/* 分红分配 */
function dividendPlan(c, year, netProfit, payout, date){
  const issued = issuedShares(c), D = num(netProfit) * num(payout) / 100, lines = [];
  let vPct = 0;
  c.grants.forEach(g => {
    const pl = getPlan(c, g.planId); if (!pl || g.status !== "active" || pl.type !== "virtual") return;
    const pct = issued ? num(g.shares) / issued : 0; vPct += pct;
    lines.push({kind:"红股", name:getP(c, g.pid)?.name || "?", gid:g.id, pct, amount:D * pct});
  });
  const R = D * Math.max(0, 1 - vPct);
  const holders = c.shareholders.map(h => ({kind:"股东", name:h.name, sh:num(h.shares)}));
  c.grants.forEach(g => { const sh = realShares(c, g); if (sh > 0) holders.push({kind:getPlan(c, g.planId).type === "option" ? "期权（已行权）" : "实股", name:getP(c, g.pid)?.name || "?", gid:g.id, sh}); });
  const tot = holders.reduce((s, h) => s + h.sh, 0);
  holders.forEach(h => lines.push({...h, pct:tot ? h.sh / tot * (1 - vPct) : 0, amount:tot ? R * h.sh / tot : 0}));
  lines.forEach(l => { const g = l.gid && c.grants.find(x => x.id === l.gid); l.offset = Math.min(g ? Math.max(0, num(g.loan)) : 0, l.amount); l.cash = l.amount - l.offset; });
  return {year, netProfit:num(netProfit), payout:num(payout), date, D, lines};
}

/* ================= 储存：网页自带的云端资料库；没有时存浏览器 ================= */
const S = {cos:{}, cur:null, page:"dashboard", asOf:todayISO(), db:null, timers:{}, writing:{}, again:{}, modal:null, ui:{}};
const LS = "equity-admin-v2";
function lsLoad(){ try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch(e){ return {}; } }
function lsSave(){ try { localStorage.setItem(LS, JSON.stringify(S.cos)); } catch(e){} }
const saveState = t => { $("#saveState").textContent = t; };
async function writeCo(id){
  if (!S.db){ lsSave(); saveState("已保存（存在这台电脑的浏览器）"); return; }
  if (S.writing[id]){ S.again[id] = true; return; }
  S.writing[id] = true; saveState("保存中…");
  try { const c = S.cos[id]; if (c) await S.db.collection("companies").doc(id).set(clone(c)); saveState("已保存到云端"); }
  catch(err){ saveState(err && err.code === "invalid_argument" ? "你只有查看权限，改动不会保存" : err && err.code === "quota_exceeded" ? "云端空间满了" : "保存失败，稍后再试"); }
  finally { S.writing[id] = false; if (S.again[id]){ S.again[id] = false; writeCo(id); } }
}
function saveCo(c, msg){
  if (!c) return;
  c.updatedAt = Date.now();
  if (msg){ c.log.unshift({t:Date.now(), d:S.asOf, msg}); c.log = c.log.slice(0, 150); }
  lsSave(); saveState("有改动，准备保存…");
  const id = c.id; clearTimeout(S.timers[id]);
  S.timers[id] = setTimeout(() => { delete S.timers[id]; writeCo(id); }, 700);
}
const save = msg => saveCo(cur(), msg);
async function initStorage(){
  S.cos = lsLoad(); pickCur(); render();
  let db = null;
  try { if (window.claude && typeof window.claude.use === "function") db = await window.claude.use("db"); } catch(e){}
  if (!db){ saveState("资料存在这台电脑的浏览器（记得在「设置」备份）"); return; }
  S.db = db; saveState("连接云端中…");
  let first = true;
  const timer = setTimeout(() => saveState("暂时连不上云端，先显示这台电脑上的资料"), 10000);
  db.collection("companies").onSnapshot(snap => {
    clearTimeout(timer);
    const cloud = {};
    snap.docs.forEach(d => { if (d.exists) cloud[d.id] = clone(d.data()); });
    if (first){ first = false; Object.keys(S.cos).forEach(id => { if (!cloud[id]){ cloud[id] = S.cos[id]; writeCo(id); } }); }
    Object.keys(S.cos).forEach(id => { if (S.writing[id] || S.timers[id]) cloud[id] = S.cos[id]; });
    const changed = JSON.stringify(cloud[S.cur]) !== JSON.stringify(S.cos[S.cur]);
    S.cos = cloud; lsSave(); pickCur();
    const typing = document.activeElement && document.activeElement.matches && document.activeElement.matches("input,textarea");
    if (changed && !typing) render(); else renderTop();
    if (!snap.metadata.fromCache) saveState("已连接云端（团队共用同一份资料）");
  }, () => { clearTimeout(timer); S.db = null; saveState("云端连不上，改存这台电脑的浏览器"); });
}
async function deleteCo(id){
  clearTimeout(S.timers[id]); delete S.timers[id]; delete S.cos[id]; lsSave();
  if (S.db){ try { await S.db.collection("companies").doc(id).delete(); } catch(e){} }
  S.cur = null; pickCur(); S.page = "dashboard"; render();
}
function pickCur(){
  if (S.cur && S.cos[S.cur]) return;
  const l = Object.values(S.cos).sort((a, b) => (b.updatedAt||0) - (a.updatedAt||0));
  S.cur = l[0] ? l[0].id : null;
}
const cur = () => S.cos[S.cur];

/* ================= 动作 ================= */
function activate(c, g, date){
  const pl = getPlan(c, g.planId);
  g.status = "active";
  if (pl.type !== "option"){
    const amt = num(g.shares) * num(g.price);
    if (g.payMode === "loan"){ g.loan = amt; c.payments.push({id:uid(), gid:g.id, date, type:"入股欠款（先借后还）", amount:amt}); }
    else { g.paid = amt; c.payments.push({id:uid(), gid:g.id, date, type:"入股付款", amount:amt}); }
  }
  c.log.unshift({t:Date.now(), d:date, msg:`授予生效：${getP(c, g.pid)?.name} · ${pl.name} · ${INT(g.shares)} 股`});
}
function applyDividend(c, dv){
  dv.id = uid();
  dv.lines.forEach(l => {
    const g = l.gid && c.grants.find(x => x.id === l.gid); if (!g) return;
    if (l.offset > 0){ g.loan = num(g.loan) - l.offset; g.paid = num(g.paid) + l.offset; c.payments.push({id:uid(), gid:g.id, date:dv.date, type:"分红抵扣欠款", amount:l.offset}); }
    if (l.cash > 0) c.payments.push({id:uid(), gid:g.id, date:dv.date, type:"分红发放", amount:l.cash});
  });
  c.dividends.unshift(dv);
  c.log.unshift({t:Date.now(), d:dv.date, msg:`发放 ${dv.year} 年分红 ${RM(dv.D)}`});
}

function allocRows(c){
  const u = S.ui.alloc, pl = getPlan(c, u.planId), issued = issuedShares(c), V = valuationAt(c, S.asOf);
  const budget = u.mode === "shares" ? num(u.amount) : u.mode === "pct" ? issued * num(u.amount) / 100 : (V && issued ? num(u.amount) / (V / issued) : 0);
  const chosen = c.participants.filter(p => eligibility(c, p, S.asOf).ok && u.sel.includes(p.id));
  const tot = chosen.reduce((s, p) => s + score(c, p, S.asOf), 0);
  const rows = chosen.map(p => { const sc = score(c, p, S.asOf), sug = tot ? Math.round(budget * sc / tot) : 0; const a = u.adj[p.id]; return {p, sc, sug, fin:a != null && a !== "" ? num(a) : sug}; });
  return {pl, budget, rows, tot, issued, V};
}

function statementText(c, p){
  if (!p) return "";
  const P_ = pps(c, S.asOf), gs = c.grants.filter(g => g.pid === p.id && g.status !== "draft");
  const L = [`【个人股权权益单】${c.name}`, `员工：${p.name}（${p.position || levelOf(c, p.levelId).name}）　日期：${S.asOf}`, `公司估值：${RM(valuationAt(c, S.asOf))}　每股：${RM2(P_)}`, ""];
  let tv = 0, tc = 0, td = 0;
  if (!gs.length) L.push("（目前没有生效的股权授予）");
  gs.forEach(g => {
    const pl = getPlan(c, g.planId), vi = vestInfo(c, g, S.asOf), divs = c.payments.filter(x => x.gid === g.id && /分红/.test(x.type)).reduce((s, x) => s + x.amount, 0);
    if (g.status === "active"){ tv += num(g.shares) * P_; tc += num(g.shares) * num(g.price); }
    td += divs;
    L.push(`■ ${pl.name}（${PLAN_TYPES[pl.type].s}）${g.status === "ended" ? " — 已结束" : ""}`);
    L.push(`  授予 ${INT(g.shares)} 股，授予日 ${g.date}，每股 ${RM2(num(g.price))}，成本 ${RM(num(g.shares)*num(g.price))}`);
    L.push(`  现在市值 ${RM(num(g.shares)*P_)}，已成熟 ${INT(vi.vested)} 股${num(g.loan) > 0.5 ? `，尚欠 ${RM(g.loan)}` : ""}`);
    L.push(`  成熟计划：${vi.events.map(e => `${e.date} ${INT(e.sh)} 股（${e.st}）`).join("；")}`);
    if (divs) L.push(`  累计分红（含抵扣欠款）：${RM(divs)}`);
    L.push("");
  });
  L.push(`合计：市值 ${RM(tv)}，成本 ${RM(tc)}，账面收益 ${RM(tv - tc)}，累计分红 ${RM(td)}`);
  return L.join("\n");
}

    `四、授予数量：本计划股权池 ${INT(pl.pool)} 股（占已发行 ${PCT(issued ? num(pl.pool)/issued : 0)}），按「岗位 × 考核 × 年资」分数分配。`,

  ].join("\n");
}

function renderModal(){

    if (m.type === "grant"){ const x = c.grants.find(y => y.id === m.id); if (x) html = grantEditor(c, x); }

function rerenderKeepFocus(){
  const a = document.activeElement, k = a && a.dataset && a.dataset.k, inModal = a && a.closest && a.closest(".modal"), y = window.scrollY;
  render(); window.scrollTo(0, y);
  if (k){ const el = document.querySelector(`${inModal ? ".modal " : ""}[data-k="${CSS.escape(k)}"]`); if (el) el.focus(); }
}

/* ================= 事件 ================= */
document.addEventListener("change", e => {
  const t = e.target, c = cur(); if (!c || t.id === "asOf" || t.id === "coSel") return;
  if (t.dataset.k){
    const k = t.dataset.k; let v;
    if (t.type === "checkbox") v = t.checked;
    else if (t.type === "number") v = t.value === "" ? (/\.(actual|target)$/.test(k) ? "" : 0) : num(t.value);
    else if (t.tagName === "SELECT" && (t.value === "true" || t.value === "false")) v = t.value === "true";
    else v = t.value;
    setPath(c, k, v);
    const m = k.match(/^plans\.(\d+)\.vestYears$/);
    if (m){ const pl = c.plans[+m[1]], n = Math.max(1, Math.min(10, Math.round(num(pl.vestYears)) || 1)); pl.vestYears = n; pl.vestCustom = Array.from({length:n}, (_, i) => num((pl.vestCustom || [])[i]) || Math.round(10000/n)/100); }
    if (/^grants\.\d+\.(planId|date)$/.test(k)){ const g = c.grants[+k.split(".")[1]]; g.price = Math.round(planPrice(c, getPlan(c, g.planId), g.date) * 100) / 100; }
    save(); setTimeout(rerenderKeepFocus, 0); return;
  }
  const ui = (obj, key, val) => { obj[key] = val; setTimeout(rerenderKeepFocus, 0); };
  if (t.dataset.ui){ const a = S.ui.alloc; if (t.dataset.ui === "planId"){ a.sel = null; a.adj = {}; a.amount = null; a.mode = "shares"; } ui(a, t.dataset.ui, t.value); return; }
  if (t.dataset.adj){ ui(S.ui.alloc.adj, t.dataset.adj, t.value); return; }
  if (t.dataset.uiDiv){ ui(S.ui.div, t.dataset.uiDiv, t.type === "number" ? num(t.value) : t.value); return; }
  if (t.dataset.uiRep){ ui(S.ui.rep, t.dataset.uiRep, t.value); return; }
  if (t.dataset.uiExit){ const k = t.dataset.uiExit; if (k === "cat") S.ui.exit.reason = 0; ui(S.ui.exit, k, t.type === "checkbox" ? t.checked : t.value); return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.tagName === "INPUT") e.target.blur();
  if (e.key === "Escape" && S.modal){ S.modal = null; render(); }
});
document.addEventListener("click", async e => {
  const go = e.target.closest("[data-go]");
  if (go){ S.page = go.dataset.go; S.modal = null; S.ui.delArm = null; history.replaceState(null, "", "#" + S.page); render(); window.scrollTo(0, 0); return; }
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const act = a.dataset.act, id = a.dataset.id, i = +a.dataset.i;
  if (a.tagName === "A") e.preventDefault();
  if (act === "bgClose"){ if (e.target === a){ S.modal = null; render(); } return; }
  if (act === "demo"){ loadDemo(); return; }
  if (act === "newCo"){ newCo(); return; }
  const c = cur(); if (!c) return;
  const done = msg => { save(msg); render(); };
  switch (act){
    case "closeModal": S.modal = null; render(); return;
    case "addVal": c.valuations.push({id:uid(), date:S.asOf, method:"pe", netProfit:0, pe:5, netAssets:0, funding:0, manual:0, note:""}); return done();
    case "delVal": c.valuations = c.valuations.filter(v => v.id !== id); return done();
    case "addHolder": c.shareholders.push({id:uid(), name:"", type:"other", shares:0}); return done();
    case "delHolder": c.shareholders.splice(i, 1); return done();
    case "addPlan": { const pl = newPlan(c); c.plans.push(pl); S.modal = {type:"plan", id:pl.id}; return done(`新建激励计划：${pl.name}`); }
    case "editPlan": S.modal = {type:"plan", id}; render(); return;
    case "delPlan":
      if (c.grants.some(g => g.planId === id)){ alertBox("这个计划已经有授予记录，不能删除。可以在「编辑规则」把状态改成「已关闭」。"); return; }
      c.plans = c.plans.filter(p => p.id !== id); return done();
    case "addPerson": { const p = newParticipant(); c.participants.push(p); S.modal = {type:"person", id:p.id}; return done(); }
    case "editPerson": S.modal = {type:"person", id}; render(); return;
    case "delPerson": c.participants = c.participants.filter(p => p.id !== id); S.modal = null; return done();
    case "peopleFilter": S.ui.peopleFilter = a.dataset.v; render(); return;
    case "gFilter": S.ui.gFilter = a.dataset.v; render(); return;
    case "allocSel": { const s = S.ui.alloc.sel, k = s.indexOf(id); if (a.checked && k < 0) s.push(id); if (!a.checked && k >= 0) s.splice(k, 1); render(); return; }
    case "genDrafts": {
      const {pl, rows} = allocRows(c); let n = 0;
      rows.forEach(r => { if (r.fin > 0){ c.grants.push(newGrant(c, pl, r.p.id, r.fin)); n++; } });
      S.ui.alloc = null; S.page = "grants"; S.ui.gFilter = "draft";
      return done(`按分配建议生成 ${n} 笔授予草稿（${pl.name}）`);
    }
    case "addGrant": {
      const ppl = c.participants.filter(p => p.status !== "left");
      if (!c.plans.length || !ppl.length){ alertBox("要先有「激励计划」和「激励对象」才能新增授予。"); return; }
      const g = newGrant(c, c.plans[0], ppl[0].id, 0); c.grants.push(g); S.modal = {type:"grant", id:g.id}; return done();
    }
    case "openGrant": S.modal = {type:"grant", id}; render(); return;
    case "repriceGrant": { const g = c.grants.find(x => x.id === id); g.price = Math.round(planPrice(c, getPlan(c, g.planId), g.date) * 100) / 100; return done(); }
    case "delGrant": c.grants = c.grants.filter(g => g.id !== id); S.modal = null; return done();
    case "activateGrant": {
      const g = c.grants.find(x => x.id === id);
      if (!(num(g.shares) > 0)){ alertBox("股数要大于 0。"); return; }
      const x = summary(c, S.asOf).plans.find(y => y.pl.id === g.planId);
      const over = x ? x.active + x.kept + num(g.shares) - num(x.pl.pool) : 0;
      if (over > 0.5){ alertBox(`这个计划的股权池不够：签了这笔会超出 ${INT(over)} 股。请先加大股权池，或减少股数。`); return; }
      activate(c, g, g.date > S.asOf ? g.date : S.asOf); save(); render(); return;
    }
    case "exercise": {
      const g = c.grants.find(x => x.id === id), n = Math.max(0, vestInfo(c, g, S.asOf).vested - num(g.exercised)), amt = n * num(g.price);
      g.exercised = num(g.exercised) + n;
      if (g.payMode === "loan"){ g.loan = num(g.loan) + amt; c.payments.push({id:uid(), gid:g.id, date:S.asOf, type:"行权欠款（先借后还）", amount:amt}); }
      else { g.paid = num(g.paid) + amt; c.payments.push({id:uid(), gid:g.id, date:S.asOf, type:"行权付款", amount:amt}); }
      return done(`${getP(c, g.pid)?.name} 行权 ${INT(n)} 股，${RM(amt)}`);
    }
    case "goExit": S.ui.exit = {gid:id, date:S.asOf, cat:"A", reason:0, np:"", val:"", faultPct:100, comp:0, accel:true, keep:false}; S.modal = null; S.page = "exits"; render(); window.scrollTo(0, 0); return;
    case "confirmExit": {
      const u = S.ui.exit, g = c.grants.find(x => x.id === u.gid); if (!g) return;
      const r = exitCalc(c, g, u);
      g.status = "ended"; g.end = {date:u.date, cat:u.cat, reason:EXIT_CATS[u.cat].items[u.reason] || "", total:r.total, kept:r.kept, vested:r.vested}; g.loan = 0;
      if (Math.abs(r.total) > 0.5) c.payments.push({id:uid(), gid:g.id, date:u.date, type:r.total >= 0 ? "离职回购付款" : "离职员工应付公司", amount:r.total});
      const p = getP(c, g.pid);
      if (p && !c.grants.some(x => x.pid === p.id && x.status === "active")){ p.status = "left"; p.leftDate = u.date; }
      S.ui.exit = null;
      return done(`${p?.name} 离职办理完成（${EXIT_CATS[u.cat].t}），公司支付 ${RM(r.total)}`);
    }
    case "payDividend": { const u = S.ui.div, dv = dividendPlan(c, u.year, u.np, u.payout, u.date); if (!(dv.D > 0)){ alertBox("可分配金额是 0。"); return; } applyDividend(c, dv); return done(); }
    case "viewDiv": S.modal = {type:"div", id}; render(); return;
    case "copy": {
      const u = S.ui.rep, txt = a.dataset.what === "stmt" ? statementText(c, getP(c, u.pid)) : planText(c, getPlan(c, u.planId));
      try { await navigator.clipboard.writeText(txt); $("#copyMsg").textContent = "✔ 已复制，可以贴到 WhatsApp / Word。"; } catch(err){ $("#copyMsg").textContent = "复制不了，请直接选取文字复制。"; }
      return;
    }
    case "print": try { window.print(); } catch(err){} return;
    case "addLevel": c.levels.push({id:"L" + uid(), name:"新层级", coef:1, minYears:0}); return done();
    case "delLevel": c.levels.splice(i, 1); return done();
    case "backup": try { await navigator.clipboard.writeText(JSON.stringify(c)); $("#bkMsg").textContent = "✔ 已复制，贴到记事本保存。"; } catch(err){ $("#bkMsg").textContent = "复制不了。"; } return;
    case "showRestore": $("#restoreBox").style.display = "block"; return;
    case "restore":
      try { const d = JSON.parse($("#restoreText").value); if (!d || !d.shareholders || !d.plans) throw 0; d.id = uid(); d.name = d.name + "（还原）"; S.cos[d.id] = d; S.cur = d.id; S.page = "dashboard"; return done("从备份还原"); }
      catch(err){ $("#bkMsg").textContent = "资料格式不对。"; } return;
    case "delCo": if (S.ui.delArm !== c.id){ S.ui.delArm = c.id; render(); return; } S.ui.delArm = null; deleteCo(c.id); return;
  }
});
function alertBox(t){ const m = document.createElement("div"); m.className = "modalbg"; m.style.zIndex = 30; m.innerHTML = `<div class="modal" style="max-width:420px"><p>${esc(t)}</p><div class="foot"><button class="btn">知道了</button></div></div>`; m.onclick = ev => { if (ev.target === m || ev.target.tagName === "BUTTON") m.remove(); }; document.body.appendChild(m); }
function newCo(){ const c = newCompany(); S.cos[c.id] = c; S.cur = c.id; S.page = "valuation"; S.ui = {}; S.modal = null; saveCo(c, "新增公司"); render(); }
function loadDemo(){ const c = demoCompany(); S.cos[c.id] = c; S.cur = c.id; S.page = "dashboard"; S.ui = {}; S.modal = null; saveCo(c); render(); }
$("#newCo").onclick = newCo;
$("#demoCo").onclick = loadDemo;
$("#coSel").onchange = e => { if (S.cos[e.target.value]){ S.cur = e.target.value; S.modal = null; S.ui = {}; render(); } };
$("#asOf").onchange = e => { if (e.target.value){ S.asOf = e.target.value; S.ui.div = null; render(); } };
document.addEventListener("mousemove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]"), tip = $("#tip");
  if (!t){ tip.style.display = "none"; return; }
  tip.textContent = t.dataset.tip; tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.clientY + 14) + "px";
});
const hashPage = () => { const h = location.hash.slice(1); if (P[h]) S.page = h; };
hashPage();
window.addEventListener("hashchange", () => { hashPage(); S.modal = null; render(); });
initStorage();
</script>
</body>
